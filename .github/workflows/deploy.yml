name: Blue-Green Deployment

on:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'Dockerfile'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build with Maven
        run: mvn clean package -DskipTests

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Detect active environment
        id: detect
        run: |
          CURRENT_TG=$(aws elbv2 describe-listeners \
            --listener-arns ${{ secrets.ALB_LISTENER_ARN }} \
            --query "Listeners[0].DefaultActions[0].TargetGroupArn" \
            --output text --region ap-south-1)
          echo "Current TG: $CURRENT_TG"

          if [ "$CURRENT_TG" = "${{ secrets.BLUE_TG_ARN }}" ]; then
            echo "ACTIVE=blue" >> $GITHUB_OUTPUT
            echo "INACTIVE=green" >> $GITHUB_OUTPUT
            echo "DEPLOY_INSTANCE=${{ secrets.GREEN_INSTANCE_ID }}" >> $GITHUB_OUTPUT
            echo "TARGET_TG=${{ secrets.GREEN_TG_ARN }}" >> $GITHUB_OUTPUT
            echo "ROLLBACK_TG=${{ secrets.BLUE_TG_ARN }}" >> $GITHUB_OUTPUT
          else
            echo "ACTIVE=green" >> $GITHUB_OUTPUT
            echo "INACTIVE=blue" >> $GITHUB_OUTPUT
            echo "DEPLOY_INSTANCE=${{ secrets.BLUE_INSTANCE_ID }}" >> $GITHUB_OUTPUT
            echo "TARGET_TG=${{ secrets.BLUE_TG_ARN }}" >> $GITHUB_OUTPUT
            echo "ROLLBACK_TG=${{ secrets.GREEN_TG_ARN }}" >> $GITHUB_OUTPUT
          fi

      - name: Build and push image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: aws-blue-green-deployment
          INACTIVE: ${{ steps.detect.outputs.INACTIVE }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$INACTIVE .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$INACTIVE
          echo "Pushed image as :$INACTIVE"

      - name: Deploy to inactive environment
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: aws-blue-green-deployment
          INACTIVE: ${{ steps.detect.outputs.INACTIVE }}
        run: |
          aws ssm send-command \
            --instance-ids ${{ steps.detect.outputs.DEPLOY_INSTANCE }} \
            --document-name "AWS-RunShellScript" \
            --parameters commands=["
              aws ecr get-login-password --region ap-south-1 | docker login --username AWS --password-stdin $ECR_REGISTRY,
              docker pull $ECR_REGISTRY/$ECR_REPOSITORY:$INACTIVE,
              docker stop app || true,
              docker rm app || true,
              docker run -d --name app -p 8080:8080 -e ENVIRONMENT=$INACTIVE --restart always $ECR_REGISTRY/$ECR_REPOSITORY:$INACTIVE
            "] \
            --region ap-south-1

      - name: Wait for instance to start
        run: |
          echo "Waiting 90 seconds..."
          sleep 90

      - name: Health check inactive environment
        run: |
          INSTANCE_IP=$(aws ec2 describe-instances \
            --instance-ids ${{ steps.detect.outputs.DEPLOY_INSTANCE }} \
            --query "Reservations[0].Instances[0].PublicIpAddress" \
            --output text --region ap-south-1)
          echo "Instance IP: $INSTANCE_IP"
          for i in {1..10}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://$INSTANCE_IP:8080/actuator/health)
            echo "Attempt $i - Status: $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "Healthy!"
              exit 0
            fi
            sleep 15
          done
          echo "Unhealthy! Keeping current environment live."
          exit 1

      - name: Flip ALB to inactive environment
        run: |
          aws elbv2 modify-listener \
            --listener-arn ${{ secrets.ALB_LISTENER_ARN }} \
            --default-actions '[{"Type":"forward","TargetGroupArn":"${{ steps.detect.outputs.TARGET_TG }}"}]' \
            --region ap-south-1
          echo "Traffic flipped to ${{ steps.detect.outputs.INACTIVE }}!"

      - name: Verify deployment
        run: |
          sleep 15
          RESPONSE=$(curl -s http://${{ secrets.ALB_DNS }}/api/version)
          echo "Response: $RESPONSE"
          if echo $RESPONSE | grep -q "${{ steps.detect.outputs.INACTIVE }}"; then
            echo "Deployment successful! ${{ steps.detect.outputs.INACTIVE }} is live!"
          else
            echo "Something went wrong! Rolling back..."
            aws elbv2 modify-listener \
              --listener-arn ${{ secrets.ALB_LISTENER_ARN }} \
              --default-actions '[{"Type":"forward","TargetGroupArn":"${{ steps.detect.outputs.ROLLBACK_TG }}"}]' \
              --region ap-south-1
            exit 1
          fi