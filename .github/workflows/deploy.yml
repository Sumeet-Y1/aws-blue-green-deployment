name: Blue-Green Deployment

on:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'Dockerfile'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build with Maven
        run: mvn clean package -DskipTests

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build and push Green image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: aws-blue-green-deployment
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:green .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:green

      - name: Deploy to Green EC2
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: aws-blue-green-deployment
        run: |
          aws ssm send-command \
            --instance-ids ${{ secrets.GREEN_INSTANCE_ID }} \
            --document-name "AWS-RunShellScript" \
            --parameters commands=["
              aws ecr get-login-password --region ap-south-1 | docker login --username AWS --password-stdin $ECR_REGISTRY,
              docker pull $ECR_REGISTRY/$ECR_REPOSITORY:green,
              docker stop app || true,
              docker rm app || true,
              docker run -d --name app -p 8080:8080 -e ENVIRONMENT=green --restart always $ECR_REGISTRY/$ECR_REPOSITORY:green
            "] \
            --region ap-south-1

      - name: Wait for Green to be healthy
        run: |
          echo "Waiting 30 seconds for Green to start..."
          sleep 30

      - name: Health check Green
        run: |
          HEALTH=$(aws elbv2 describe-target-health \
            --target-group-arn ${{ secrets.GREEN_TG_ARN }} \
            --region ap-south-1 \
            --query "TargetHealthDescriptions[0].TargetHealth.State" \
            --output text)
          echo "Green health: $HEALTH"
          if [ "$HEALTH" != "healthy" ]; then
            echo "Green is unhealthy! Keeping Blue live."
            exit 1
          fi

      - name: Flip ALB to Green
        run: |
          aws elbv2 modify-listener \
            --listener-arn ${{ secrets.ALB_LISTENER_ARN }} \
            --default-actions Type=forward,TargetGroupArn=${{ secrets.GREEN_TG_ARN }} \
            --region ap-south-1
          echo "Traffic flipped to Green!"

      - name: Verify Green is live
        run: |
          sleep 10
          RESPONSE=$(curl -s http://${{ secrets.ALB_DNS }}/api/version)
          echo "Response: $RESPONSE"
          if echo $RESPONSE | grep -q "green"; then
            echo "Green is live!"
          else
            echo "Something went wrong! Rolling back to Blue..."
            aws elbv2 modify-listener \
              --listener-arn ${{ secrets.ALB_LISTENER_ARN }} \
              --default-actions Type=forward,TargetGroupArn=${{ secrets.BLUE_TG_ARN }} \
              --region ap-south-1
            exit 1
          fi